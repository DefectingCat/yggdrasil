# docker-compose.dev.yml — Docker 开发环境
#
# 用法：
#   make docker-dev          # 构建并启动（前台日志）
#   make docker-dev-down     # 停止并移除容器
#   make docker-dev-shell    # 进入 dev 容器交互式 shell
#
# 或直接：
#   docker compose -f docker-compose.dev.yml up --build
#
# 架构：
#   ┌─────────────────────────────────────────────────────┐
#   │ Host (macOS)                                        │
#   │   PostgreSQL :5432 (宿主原生, 不由 compose 管理)      │
#   │   IDE 编辑源码 ──bind mount──▶ /build (dev container)│
#   │   浏览器 ◀── :8080 ────────── dx serve (:8080)       │
#   └─────────────────────────────────────────────────────┘
#
# 数据库：dev 容器通过 host.docker.internal 连接宿主 PostgreSQL。
# 前提：宿主已运行 PostgreSQL 且 DATABASE_URL 指向它（见 .env）。
#
# Volume 策略：
#   .:/build                      bind mount 源码（IDE 编辑即时可见）
#   target/ → named volume        cargo 编译缓存（避免 VirtioFS 性能瓶颈）
#   libs/node_modules → volume    pnpm 依赖（与宿主隔离）
#   cargo registry → named volume crate 下载缓存

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # host.docker.internal 在 Docker Desktop 上自动解析到宿主 IP，
    # 让容器内的 server 能连接宿主原生 PostgreSQL（:5432）。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 源码 bind mount — 宿主编辑即时可见，dx serve inotify 热重载
      - .:/build
      # cargo 编译产物 — named volume 避免 VirtioFS 小文件性能瓶颈
      - yggdrasil-dev-target:/build/target
      # pnpm 依赖 — 与宿主 node_modules 隔离
      - yggdrasil-dev-node-modules:/build/libs/node_modules
      # pnpm 全局 store — named volume 避免重复下载
      - yggdrasil-dev-pnpm-store:/root/.local/share/pnpm/store
      # cargo registry + git 缓存 — named volume 避免 crate 重复下载
      - yggdrasil-dev-cargo-registry:/usr/local/cargo/registry
      - yggdrasil-dev-cargo-git:/usr/local/cargo/git
      # 防止 pnpm 在项目根目录创建 .pnpm-store/ 泄漏到宿主 bind mount
      - /build/.pnpm-store
      # Code runner: 挂载 Docker socket（取消注释以启用代码沙箱功能）
      # 注意: 需先构建 runner 镜像 (bash docker/build-runners.sh)
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8080"
    environment:
      # 连接宿主 PostgreSQL。端口/密码/库名按 .env 调整。
      DATABASE_URL: postgres://postgres:postgres@host.docker.internal:5432/yggdrasil
      RUST_LOG: info
      SSR_CACHE_SECS: "0"
      APP_BASE_URL: http://localhost:8080
      # Code runner（取消 Docker socket 挂载后启用）
      DOCKER_SOCKET_PATH: /var/run/docker.sock
    # dx serve 前台运行，日志直接输出到 docker compose
    stdin_open: true
    tty: true

volumes:
  yggdrasil-dev-target:
  yggdrasil-dev-node-modules:
  yggdrasil-dev-cargo-registry:
  yggdrasil-dev-cargo-git:
  yggdrasil-dev-pnpm-store:
